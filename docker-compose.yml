version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sismo-backend
    restart: unless-stopped
    expose:
      - "8082"
    environment:
      - PORT=8082
    volumes:
      - sismo-db:/app/data
    networks:
      - sismo-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: sismo-frontend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - PORT=3001
    networks:
      - sismo-network
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sismo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - sismo-network
    depends_on:
      - frontend
      - backend

volumes:
  sismo-db:

networks:
  sismo-network:
    driver: bridge

<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>SismoMonitor — Centro de Control Analítico de Sismos (USGS & FUNVISIS)</title>
		<meta name="description" content="Monitoreo sísmico en tiempo real con datos de USGS y FUNVISIS. Mapa interactivo, alertas de emergencia por Telegram, noticias y TV en vivo. Desarrollado por JAG-MEDIA SERVICIOS, C.A.">
		<meta name="keywords" content="sismos, terremotos, Venezuela, USGS, FUNVISIS, monitoreo sísmico, alertas, actividad sísmica">
		<meta name="author" content="JAG-MEDIA SERVICIOS, C.A">
		<meta property="og:title" content="SismoMonitor — Monitoreo Sísmico en Tiempo Real">
		<meta property="og:description" content="Actividad sísmica global y de Venezuela con datos USGS + FUNVISIS, alertas OSINT y mapa interactivo.">
		<meta property="og:type" content="website">
		<meta property="og:url" content="https://sismo.jagmedia.com.ve">
		<meta property="og:image" content="/favicon/apple-icon-180x180.png">
		<meta name="twitter:card" content="summary_large_image">
		<meta name="twitter:title" content="SismoMonitor — Monitoreo Sísmico en Tiempo Real">
		<meta name="twitter:description" content="Actividad sísmica global y de Venezuela en tiempo real.">
		<link rel="canonical" href="https://sismo.jagmedia.com.ve">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
		<link rel="alternate" type="application/rss+xml" title="SismoMonitor - Últimos Sismos" href="/api/earthquakes/rss">
		<!-- Favicon package generated by Favicon.im Generator -->
		<link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon/android-chrome-192x192.png">
		<link rel="icon" type="image/png" sizes="512x512" href="/favicon/android-chrome-512x512.png">
		<link rel="manifest" href="/favicon/manifest.json">
		<meta name="theme-color" content="#0f1115">
		<!-- Google Fonts con display=swap para evitar bloqueo de renderizado -->
		<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap">
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" media="all">
		<!-- Font Awesome: carga no bloqueante -->
		<link rel="preload" as="style" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'" crossorigin>
		<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin></noscript>
		<!-- Leaflet CSS -->
		<link rel="stylesheet" href="/leaflet.css"/>
		<!-- HLS.js solo se necesita en la pestaña TV: carga asíncrona -->
		<script src="/hls.min.js" async></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/sw.js').catch(error => {
						console.error('ServiceWorker registration failed: ', error);
					});
				});
			}
		</script>
	</body>
</html>
